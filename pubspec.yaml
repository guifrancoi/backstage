name: backstage
description: "Backstage"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.0.5
  image_picker: ^1.1.2
  url_launcher: ^6.3.0
  device_preview_plus: ^2.6.1
  http: ^1.2.2
  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0
  cloud_firestore: ^6.10.0
  firebase_crashlytics: ^5.4.0
  cupertino_icons: ^1.0.9
  table_calendar: ^3.2.1
  intl: ^0.20.2
  fl_chart: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  fake_cloud_firestore: 4.3.0
  firebase_auth_mocks: ^0.15.2

flutter:
  uses-material-design: true

  # Plano 8: Inter (OFL, ver assets/fonts/OFL-Inter.txt), empacotada para
  # funcionar offline.
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
        - asset: assets/fonts/Inter-ExtraBold.ttf
          weight: 800
